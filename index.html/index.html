<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club Deportivo Independiente Río Colorado</title>
<style>
body{font-family:Arial;margin:0;background:#C00000;color:white;text-align:center}
.container{padding:20px}
input,select,button{width:90%;padding:10px;margin:5px;border:none;border-radius:8px}
button{background:black;color:white;font-weight:bold}
.card{background:white;color:black;padding:15px;border-radius:15px;margin:10px}
.hidden{display:none}
</style>
</head>
<body>

<div class="container">
<h1>Club Deportivo Independiente</h1>

<div id="login">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Contraseña">
<button onclick="login()">Ingresar</button>
<button onclick="showRegister()">Registrarse</button>
</div>

<div id="register" class="hidden">
<input id="rnombre" placeholder="Nombre">
<input id="rapellido" placeholder="Apellido">
<input id="remail" placeholder="Email">
<input id="rpassword" type="password" placeholder="Contraseña">
<select id="rrole">
<option value="PLAYER">Jugador/a</option>
<option value="COACH">Entrenador/a</option>
</select>
<button onclick="register()">Crear cuenta</button>
<button onclick="showLogin()">Volver</button>
</div>

<div id="dashboard" class="hidden">
<h2 id="welcome"></h2>

<div id="playerPanel" class="card hidden">
<h3>Panel Jugador</h3>
<label>Goles 2026</label>
<input type="number" id="goles">
<button onclick="saveGoals()">Guardar</button>
</div>

<div id="coachPanel" class="card hidden">
<h3>Panel Entrenador</h3>
<input id="ejTitulo" placeholder="Título ejercicio">
<input id="ejDesc" placeholder="Descripción">
<button onclick="saveExercise()">Guardar ejercicio</button>
</div>

<div id="adminPanel" class="card hidden">
<h3>Panel Admin</h3>
<button onclick="showUsers()">Ver Usuarios</button>
<div id="userList"></div>
</div>

<button onclick="logout()">Cerrar sesión</button>
</div>

</div>

<script>
let users=JSON.parse(localStorage.getItem("users")||"[]");
let currentUser=null;

if(!users.find(u=>u.role==="ADMIN")){
users.push({email:"admin@club.com",password:"admin123",role:"ADMIN"});
localStorage.setItem("users",JSON.stringify(users));
}

function showRegister(){document.getElementById("login").classList.add("hidden");document.getElementById("register").classList.remove("hidden")}
function showLogin(){document.getElementById("register").classList.add("hidden");document.getElementById("login").classList.remove("hidden")}

function register(){
users.push({
email:remail.value,
password:rpassword.value,
role:rrole.value,
nombre:rnombre.value,
apellido:rapellido.value,
goles:0
});
localStorage.setItem("users",JSON.stringify(users));
alert("Cuenta creada");
showLogin();
}

function login(){
let u=users.find(x=>x.email===email.value&&x.password===password.value);
if(!u){alert("Datos incorrectos");return}
currentUser=u;
document.getElementById("login").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");
document.getElementById("welcome").innerText="Bienvenido "+(u.nombre||"Admin");
if(u.role==="PLAYER"){playerPanel.classList.remove("hidden");goles.value=u.goles||0}
if(u.role==="COACH"){coachPanel.classList.remove("hidden")}
if(u.role==="ADMIN"){adminPanel.classList.remove("hidden")}
}

function saveGoals(){
currentUser.goles=goles.value;
localStorage.setItem("users",JSON.stringify(users));
alert("Goles guardados");
}

function saveExercise(){
alert("Ejercicio guardado (demo local)");
}

function showUsers(){
userList.innerHTML="";
users.forEach(u=>{
userList.innerHTML+=`<p>${u.email} - ${u.role}</p>`;
});
}

function logout(){location.reload()}
</script>

</body>
</html>
