<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club Independiente</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#b30000,#ff1a1a);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:40px;
    border-radius:15px;
    width:320px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.logo{
    width:120px;
    margin-bottom:20px;
}

h2{
    color:#b30000;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:14px;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#b30000;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#800000;
}

.footer{
    margin-top:15px;
    font-size:12px;
    color:#666;
}
</style>
</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h2>Club Independiente</h2>

<input type="email" placeholder="Correo electrónico">
<input type="password" placeholder="Contraseña">

<button onclick="login()">Ingresar</button>

<div class="footer">
Sistema interno del club
</div>

</div>

<script>
function login(){
    alert("Bienvenido al sistema del Club Independiente ??");
}
</script>

</body>
</html>
